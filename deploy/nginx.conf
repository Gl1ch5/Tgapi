# /etc/nginx/sites-available/tgapi  — replace tg.example.com, then: certbot --nginx -d tg.example.com
server {
    listen 80;
    server_name tg.example.com;

    client_max_body_size 2000m;   # uploads via /v1/messages/send-file

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;      # long-poll /v1/updates
        proxy_buffering off;
    }
}
